# The fast checks, on every push. Nothing here builds firmware or fuzzes.
#
# "Fast" is about the checks, not the job: they take seconds, and the checkout does not. This
# needs the submodules -- asan_sync_check compares uefi_asan against eval_source/edk2, and the
# gitlink assertion reads all four -- and eval_source/edk2 is a full edk2 tree, so a FIRST run
# on a new runner spends about nine minutes and ~24 GB fetching it. After that
# actions/checkout reuses the workspace. Both measured on 2026-10-19, same runner, both
# Succeeded: the first run 19:36:48 to 19:46 (~9 min), the next 19:47:02 to 19:47:29
# (27 seconds). So the cost is paid once per runner, not once per push.
#
# It exists for two reasons. The first is the ordinary one -- a syntax error in a driver
# script or a drifted sanitizer copy should not wait for someone to run a sweep. The second
# is that it is the only thing that exercises the self-hosted runner on a normal day: the
# fuzzing workflows are workflow_dispatch, so without this a runner can sit broken or
# unregistered for a week and the first sign of it is a sweep that never starts.
name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # The failure this catches is silent and expensive: a shallow or partial submodule
      # fetch leaves a submodule on its branch tip rather than the commit this repo records,
      # and the run then builds code nobody asked for. Seen for real -- a --depth=1 clone put
      # firness 40 commits off and the SMI fix simply was not there.
      - name: Submodules are at the commits this repo records
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          for m in firness uefi_asan tsffs eval_source/edk2; do
            [ -e "$m/.git" ] || { echo "::error::$m is not checked out"; rc=1; continue; }
            want=$(git ls-tree HEAD "$m" | awk '{print $3}')
            have=$(git -C "$m" rev-parse HEAD)
            if [ "$want" != "$have" ]; then
              echo "::error::$m is at ${have:0:12}, this repo records ${want:0:12}"
              rc=1
            else
              echo "  ok $m ${have:0:12}"
            fi
          done
          exit $rc

      # A submodule's `branch =` is what `git submodule update --remote` follows. All four
      # eval_source entries declared simics-sanitizer while their gitlinks sat on
      # simics-working or master -- 61 commits apart for edk2, with the gitlink not even
      # reachable from the declared branch, so a --remote update silently replaced the
      # sanitizer port with a version missing every recent fix. The gitlink assertion above
      # cannot see this: both sides were self-consistent, and only the declaration was wrong.
      - name: Each submodule's declared branch contains its gitlink
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          while read -r key path; do
            name=${key#submodule.}; name=${name%.path}
            decl=$(git config -f .gitmodules --get "submodule.$name.branch" || true)
            [ -n "$decl" ] || { echo "  -- $path declares no branch"; continue; }
            [ -e "$path/.git" ] || { echo "  -- $path is not checked out"; continue; }
            want=$(git ls-tree HEAD "$path" | awk '{print $3}')
            # Needs history to answer. A shallow submodule checkout cannot, and saying so
            # is better than passing silently on a question we did not ask.
            if ! git -C "$path" rev-parse --quiet --verify "origin/$decl^{commit}" >/dev/null; then
              echo "::warning::$path has no origin/$decl locally; cannot verify containment"
              continue
            fi
            if git -C "$path" merge-base --is-ancestor "$want" "origin/$decl" 2>/dev/null; then
              echo "  ok $path ${want:0:12} is on $decl"
            else
              echo "::error::$path records ${want:0:12}, which is NOT on its declared"
              echo "::error::branch '$decl' -- a submodule update --remote would move this"
              echo "::error::tree to different code. Fix .gitmodules or move the gitlink."
              rc=1
            fi
          done < <(git config -f .gitmodules --get-regexp 'submodule\..*\.path')
          exit $rc

      - name: The two copies of the sanitizer agree
        shell: bash
        run: python3 scripts/asan_sync_check.py --quiet

      # Findings must never reach upstream tianocore. The guard used to be one shell
      # `case` in action.yml, and a case-variant owner walked straight through it --
      # GitHub owner names are case-insensitive, so TianoCore/edk2 resolves upstream.
      # This slices the live guard out of action.yml rather than copying it, so the test
      # cannot keep passing while the file it checks drifts away from it.
      - name: Findings cannot be filed upstream
        shell: bash
        run: python3 scripts/upstream_guard_check.py

      # The policy that decides whether a multi-version sweep is red. It used to be an
      # `|| rc=1` in fuzz-edk2.yml, which made the weekly sweep fail on every run it ever
      # completed: a degraded stage exits non-zero and no full-size sweep has come back
      # without one. The policy now lives in a script so that this can assert it, in both
      # directions, including the exit codes the driver promises it.
      - name: The sweep verdict policy holds
        shell: bash
        run: python3 scripts/sweep_verdict.py --selftest

      # The gates in stable-e2e.yml and uses-smoke.yml are heredoc'd Python. The YAML
      # parse below accepts whatever they contain -- a heredoc body is just a string --
      # and the step above only reads scripts/*.py, so a typo in one surfaced as the job
      # it gates failing, an hour of firmware build later.
      # The action reports a degraded run as warnings instead of failing the step. That
      # branch only runs when the driver exits 2, which no cheap CI run produces, so it
      # is asserted directly instead.
      - name: A degraded run is reported, not hidden
        shell: bash
        run: python3 scripts/degraded_report.py --selftest

      # ...and whether anything ever CALLS that reporter. It did not: GitHub runs a
      # composite `shell: bash` step as `bash -e -o pipefail`, the driver exits 2 for a
      # degraded run, and errexit killed the Fuzz step at the driver's own pipeline --
      # before rc was read, before the degraded branch, and before the issue-filing step
      # that follows it. So a degraded run failed the job and filed nothing, with every
      # stage passed or warned. The reporter's self test could not see this, because it
      # tests what the reporter prints and not that it is reached.
      - name: A degraded run reaches the reporter at all
        shell: bash
        run: python3 scripts/degraded_path_check.py

      # One unreachable submodule used to poison every other submodule in the tree:
      # `git submodule update` aborts on the failure, the abort lands before the checkout
      # pass, and the rest are left at their branch tip rather than the recorded commit.
      # The tree then reads as dirty and the port stage refuses it, naming neither
      # submodules nor the one that failed. Builds real repositories with a dead remote;
      # needs no network.
      - name: A dead submodule does not poison the others
        shell: bash
        run: python3 scripts/submodule_repair_check.py

      # --extra-build-options has to turn a caller's entry into a line a DSC parser
      # accepts. The first version asked whether the entry contained an '=' to tell a
      # tools_def assignment from a flag list -- most compiler flags contain one, so
      # `-fno-sanitize=pointer-overflow` went in verbatim and failed a firmware build
      # with `error 3000`. A table of strings settles that in a second.
      - name: Caller build options become valid DSC lines
        shell: bash
        run: python3 scripts/build_options_check.py

      # This pipeline builds OVMF twice -- once for the firmware, once under bear inside
      # IMAGE_DOCKERFILE for the compilation database -- and it is the SECOND one whose
      # image every campaign boots. PcdResetOnMemoryTypeInformationChange=FALSE was added
      # to the first with a comment saying "Passed for every build", never reached the
      # second, and so every SMM campaign warm-reset in BDS and reported 0 iterations. Six
      # wrong theories before anyone compared the two command lines.
      - name: Both OVMF builds agree on their overrides
        shell: bash
        run: python3 scripts/build_parity_check.py

      # A boot that is still narrating must not be killed on a clock. Four campaigns were
      # killed sixteen debug-port lines short of "[Bds]Booting" and the run advised raising
      # a timeout, which is indistinguishable from the advice it gives a boot that stopped
      # dead. Seven cases, each a few hundred milliseconds.
      - name: A boot that is still moving keeps its slot
        shell: bash
        run: python3 scripts/boot_wait_check.py

      - name: Every SMI handler is harnessed or explained
        shell: bash
        run: python3 scripts/smi_coverage_check.py

      - name: A protocol is found even when its header breaks convention
        shell: bash
        run: python3 scripts/protocol_discovery_check.py

      - name: An ASSERT is reported and does not end the campaign
        shell: bash
        run: python3 scripts/assert_report_check.py

      - name: An address in SMRAM names the module that contains it
        shell: bash
        run: python3 scripts/module_attribution_check.py

      - name: The instrumented count is about the modules' own code
        shell: bash
        run: python3 scripts/own_code_check.py

      - name: A field tested against a constant can reach one
        shell: bash
        run: python3 scripts/scalar_choice_check.py

      - name: The port edits edk2 without rewriting it
        shell: bash
        run: python3 scripts/port_merge_check.py

      - name: A handler's cross-module calls are recorded
        shell: bash
        run: python3 scripts/smi_call_edges_check.py

      - name: Every way into SMM is discovered, only the drivable ones harnessed
        shell: bash
        run: python3 scripts/smi_dispatch_check.py

      - name: The harness reaches the DXE firmware volume, unconditionally
        shell: bash
        run: python3 scripts/fv_harness_check.py

      - name: The dxe harness timing is wired from the generator to the booted .fd
        shell: bash
        run: python3 scripts/dxe_timing_check.py

      - name: A report seen during the boot is not called input driven
        shell: bash
        run: python3 scripts/boot_phase_check.py

      - name: The SMI generator skips no step the protocol generator takes
        shell: bash
        run: python3 scripts/smi_generator_parity_check.py

      - name: A comm buffer's trailing member is fuzzed as a payload
        shell: bash
        run: python3 scripts/payload_fill_check.py

      - name: Retiring a finding frees its site key before it closes
        shell: bash
        run: python3 scripts/close_issues_check.py

      - name: SMM code is instrumented and the shadow writers are bounded
        shell: bash
        run: python3 scripts/smm_asan_check.py

      - name: A finding's evidence reaches the branch its issue links to
        shell: bash
        run: python3 scripts/evidence_push_check.py

      - name: A sanitizer detection cannot be announced without being reported
        shell: bash
        run: python3 scripts/fwsan_report_check.py

      - name: No pipeline function reads a name that is never bound
        shell: bash
        run: python3 scripts/unbound_name_check.py

      # The release gate in stable-e2e.yml, run against fixtures. It is extracted from
      # the workflow rather than restated, because a restatement drifts -- and that gate
      # has been wrong three times, every time by ACCEPTING a run it should have
      # rejected, which is the direction no green CI run can reveal.
      - name: The stable-release gate accepts and rejects the right runs
        shell: bash
        run: python3 scripts/e2e_gate_check.py

      - name: The Python embedded in the workflows parses
        shell: bash
        run: python3 scripts/embedded_python_check.py

      - name: Every driver script parses
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          for f in scripts/*.py; do
            python3 -c "import ast,sys;ast.parse(open(sys.argv[1]).read())" "$f" \
              || { echo "::error file=$f::does not parse"; rc=1; }
          done
          for f in scripts/*.sh; do
            bash -n "$f" || { echo "::error file=$f::shell syntax error"; rc=1; }
          done
          exit $rc

      # A workflow or the action failing to parse is the one error that cannot report
      # itself: GitHub refuses the file and the run never appears.
      - name: The workflows and the action parse
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import glob, sys
          try:
              import yaml
          except ImportError:
              print('PyYAML absent on this runner; skipping the YAML parse')
              sys.exit(0)
          bad = 0
          for f in ['action.yml'] + sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  yaml.safe_load(open(f))
                  print('  ok', f)
              except Exception as exc:
                  print(f'::error file={f}::{exc}')
                  bad = 1
          # A composite action's run step needs its own shell. Omit it and the action is
          # accepted at publish time and fails at use time, in somebody else's workflow,
          # with "required property is missing: shell" -- so check it here where it is ours.
          try:
              action = yaml.safe_load(open('action.yml'))
              # The Marketplace refuses a description of 125 characters or more, and the
              # only place it says so is the publish form. A description grows by someone
              # adding one true clause to it, which is exactly the edit nobody expects to
              # break anything, so the limit is asserted here instead of at publish time.
              desc = (action.get('description') or '').strip()
              if len(desc) >= 125:
                  print(f'::error file=action.yml::description is {len(desc)} characters; '
                        f'the Marketplace refuses 125 or more')
                  bad = 1
              # Without branding the publish is refused outright, and the icon and colour
              # both come from fixed GitHub lists rather than being free text.
              brand = action.get('branding') or {}
              if not brand.get('icon') or not brand.get('color'):
                  print('::error file=action.yml::branding needs both an icon and a color '
                        'or the action cannot be published')
                  bad = 1
              for step in (action.get('runs', {}) or {}).get('steps', []) or []:
                  if 'uses' not in step and 'shell' not in step:
                      print(f"::error file=action.yml::step "
                            f"{step.get('name', step.get('id', '?'))!r} declares no shell")
                      bad = 1
          except Exception as exc:
              print(f'::error file=action.yml::{exc}')
              bad = 1
          sys.exit(bad)
          PY

      # Not a build, just the question "could this runner build at all" -- the images are
      # what every later stage needs, and a runner missing them fails a sweep an hour in.
      - name: The runner has what a sweep needs
        shell: bash
        run: |
          set -uo pipefail
          docker version --format '  docker {{.Server.Version}}' || {
            echo "::error::this runner cannot talk to docker"; exit 1; }
          missing=''
          for img in fuzzuer-base:latest fuzzuer-ci:latest; do
            docker image inspect "$img" >/dev/null 2>&1 \
              && echo "  image $img present" \
              || missing="$missing $img"
          done
          if [ -n "$missing" ]; then
            echo "::warning::this runner is missing:$missing -- run scripts/bootstrap_runner.sh on it"
          fi
          docker ps --format '{{.Names}}' | grep -qx fwbuild-stack \
            && echo '  builder container up' \
            || echo '::warning::fwbuild-stack is not running; fuzz_edk2.py will refuse to start'
