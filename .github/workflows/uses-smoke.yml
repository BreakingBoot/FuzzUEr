# Can another repository consume this action the normal way -- `uses: owner/repo@ref`?
#
# Nothing has ever tested that path, and three places in this repository used to say it was
# impossible: the consumer workflow and docs/private-edk2.md both claimed GitHub's action
# download times out after 100 seconds, while action.yml carries seventy lines of fallback
# written on the assumption that it works. The timeout claim was measured false -- the
# repository's tarball is about 12 MB and arrives in roughly a second -- so the fallback is
# the half that matters, and it had no cover at all.
#
# What makes `uses:` need a fallback is unrelated to download time: GitHub fetches a
# referenced action as a repository ARCHIVE, and an archive carries no submodule contents.
# This action needs four of them, so action.yml detects the empty directories and clones
# its own repository at the ref it was referenced by. THIS workflow is the only thing that
# exercises that clone.
#
# Deliberately referenced by `@main` rather than `./`: a local path is what action-smoke.yml
# already covers, and a local path never produces an archive, so it can never reach the
# code under test here.
#
# Costs a firmware build, so it is not on every push. Push a branch whose name starts with
# "ci-uses-" to run it, or dispatch it.
name: Consumed as an action

on:
  push:
    branches: ['ci-uses-**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumed:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 90
    steps:
      # The tree under test, and the ONLY checkout here -- the action is deliberately not
      # checked out, because it has to arrive the way it arrives for anybody else.
      #
      # A clean upstream release. The first version of this test pointed at
      # cglosner/edk2@simics-working -- the fork that already carries the sanitizer port --
      # and then asked the action to apply the port to it, which is not what a consumer
      # does and not something the port is built to survive. Full depth because the driver
      # resolves the ref out of git history.
      - uses: actions/checkout@v4
        with:
          repository: tianocore/edk2
          ref: edk2-stable202608
          path: tree
          fetch-depth: 0

      # Out of RUNNER_TEMP, which the runner wipes at job end. Without this a failure
      # inside the action leaves nothing to read back, which is exactly where the first two
      # attempts at this test left me.
      - name: Where to keep the results
        id: where
        run: echo "out=$HOME/fuzzuer-uses-out/$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

      - id: fuzz
        uses: BreakingBoot/FuzzUEr@main
        with:
          out: ${{ steps.where.outputs.out }}
          source: tree
          qualify-only: true
          bootstrap: true
          # The tree being fuzzed belongs to another repository, and a smoke test must not
          # file findings there because this repository's CI ran.
          open-issues: false

      - name: The action arrived complete and reported what it should
        shell: bash
        env:
          RESULTS: ${{ steps.fuzz.outputs.results }}
          STAGES: ${{ steps.fuzz.outputs.stages }}
        run: |
          set -uo pipefail
          echo "  results = ${RESULTS:-<empty>}"
          echo "  stages  = ${STAGES:-<empty>}   (passed/total)"
          [ -n "${RESULTS:-}" ] || { echo "::error::the action set no results path"; exit 1; }
          # Against run.json, not the `stages` output. That output is a count -- "11/11" --
          # so matching it for stage names, which an earlier version of this did, could
          # never fire however broken the run was.
          python3 - "$RESULTS" <<'PY'
          import json, os, sys
          root = sys.argv[1]
          try:
              run = json.load(open(os.path.join(root, 'run.json')))
          except OSError as exc:
              sys.exit(f'::error::cannot read run.json: {exc} -- the action failed before '
                       f'the driver ran, so the fault is in its own setup steps, not a stage')
          for s in run.get('stages', []):
              print(f"  [{'PASS' if s['ok'] else 'FAIL'}] {s['name']:<13} {s.get('detail','')[:76]}")
          # ok is True, False, or None for a stage that did not run. `not s['ok']` counts
          # None as a failure, and this test asks for qualify-only -- which SKIPS fuzz and
          # triage by design -- so the whole pipeline passed and the gate failed anyway.
          bad = [s['name'] for s in run.get('stages', []) if s['ok'] is False]
          skipped = [s['name'] for s in run.get('stages', []) if s['ok'] is None]
          if skipped:
              print(f"  skipped (expected under qualify-only): {', '.join(skipped)}")
          # The failure this test exists to catch names itself: an archive arrives without
          # submodule contents, and the stages that read one are the first to notice.
          for name in ('submodules', 'port'):
              if name in bad:
                  print(f"::error::the '{name}' stage failed. An archive carries no submodule")
                  print("::error::contents and this action clones its own repository to repair")
                  print("::error::that -- so this is the uses: path, not a driver regression.")
          if bad:
              sys.exit(f"::error::stage(s) failed: {', '.join(bad)}")
          print('  consumed as a published action: OK')
          PY

      - name: Keep the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uses-smoke-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            ${{ steps.where.outputs.out }}/pipeline.log
            ${{ steps.where.outputs.out }}/run.json
