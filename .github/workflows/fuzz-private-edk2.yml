# Fuzz an edk2 tree that lives in another repository, including a private one.
#
# The other workflow here, fuzz-edk2.yml, sweeps upstream tags out of the fork beside this
# repository. This one takes a repository and a ref you name, which is what you want for a
# platform branch or a vendor tree: nothing is added to that repository, and it is only ever
# read.
#
# Private repositories need a token, because the job's built-in GITHUB_TOKEN is scoped to
# THIS repository and cannot read another one. Make a fine-grained PAT with
# "Contents: write" AND "Issues: write" on the edk2 repository and store it as the secret
# EDK2_TOKEN. Read-only is not enough: the same secret is passed as findings-token, which
# files the issues and pushes the fuzzuer-evidence branch, so a Contents-read token fuzzes
# fine and then loses every finding at the last step. A public
# edk2 needs no secret at all.
name: Fuzz a private EDK2

on:
  # This workflow had never run, not once, in any configuration. It was dispatch-only, and
  # dispatching needs an API token, so neither its two checkouts nor the way it passes a
  # token through to the action had ever been executed. A push to "ci-private-**" runs it
  # against a PUBLIC upstream release qualify-only, which exercises everything except the
  # one thing a public tree cannot: the PAT path for a private repository.
  push:
    branches: ['ci-private-**']
  workflow_dispatch:
    inputs:
      repository:
        description: 'owner/repo holding the edk2 tree (private is fine, with EDK2_TOKEN set)'
        required: true
      ref:
        description: 'Tag, branch or SHA in that repository'
        required: false
        default: ''
      budget:
        description: 'Seconds of fuzzing per target'
        required: false
        default: '600'
      jobs:
        description: 'Targets fuzzed at once (blank: a quarter of the runner''s cores)'
        required: false
        default: ''
      targets:
        description: 'Space separated protocol names (blank: everything discovered in the tree)'
        required: false
        default: ''
      qualify_only:
        description: 'Every stage except the fuzzing -- minutes, not hours. Try this first'
        type: boolean
        required: false
        default: true
      smm:
        description: 'Build with SMM_REQUIRE=TRUE so SMI handlers have an SMM core to answer'
        type: boolean
        required: false
        default: false

permissions:
  contents: read   # nothing is written to THIS repository; the issues go to the fuzzed one

jobs:
  fuzz:
    runs-on: [self-hosted, linux, x64]
    # A qualify run is minutes. A full sweep of one tree at a 600s budget is hours, and the
    # default here has to cover the slow case or the job is killed with a partial report
    # already written -- which reads as incomplete rather than as cut short.
    timeout-minutes: 1440
    steps:
      # FuzzUEr itself: the driver, the sanitizer port and the harness generator. Submodules
      # are required -- without them the images build with an empty harness generator.
      - name: Check out FuzzUEr
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # A push event carries no inputs -- `github.event.inputs.*` is empty for every one
      # of them, including the ones declared `required: true` and the ones with defaults,
      # because an input default applies to workflow_dispatch and nothing else. Left as
      # they were, an empty `repository` makes actions/checkout take THIS repository and
      # an empty `qualify_only` makes the action fuzz for hours. So the effective target
      # is resolved once, here, and both later steps read it from these outputs.
      - name: What to fuzz
        id: what
        shell: bash
        env:
          IN_REPO: ${{ github.event.inputs.repository }}
          IN_REF: ${{ github.event.inputs.ref }}
          IN_QUALIFY: ${{ github.event.inputs.qualify_only }}
        run: |
          set -uo pipefail
          REPO="${IN_REPO:-}"
          REF="${IN_REF:-}"
          QUALIFY="${IN_QUALIFY:-}"
          ISSUES='true'
          if [ -z "$REPO" ]; then
            # Branch-pushed: the self-test. A public upstream release, every stage except
            # the fuzzing, and no issues -- a smoke test must not file findings into
            # somebody else's repository because this repository's CI ran. The action
            # refuses upstream outright, but relying on that would be testing the guard
            # rather than this workflow.
            REPO='tianocore/edk2'
            REF='edk2-stable202608'
            QUALIFY='true'
            ISSUES='false'
            echo "no inputs, so this is the ci-private-** self-test"
          fi
          # Matches the input's own declared default. Blank reaches the action as "not
          # true", which is a full sweep.
          [ -n "$QUALIFY" ] || QUALIFY='true'
          echo "repository=$REPO" >> "$GITHUB_OUTPUT"
          echo "ref=$REF"         >> "$GITHUB_OUTPUT"
          echo "qualify=$QUALIFY" >> "$GITHUB_OUTPUT"
          echo "issues=$ISSUES"   >> "$GITHUB_OUTPUT"
          echo "  $REPO @ ${REF:-<default branch>}  qualify-only=$QUALIFY  issues=$ISSUES"

      # The tree under test, kept out of the way of this repository's own files. Full depth
      # because the driver resolves the ref out of git history and makes a worktree of it;
      # a shallow clone has only one commit and any other ref then has to be fetched.
      - name: Check out the EDK2 tree
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.what.outputs.repository }}
          ref: ${{ steps.what.outputs.ref }}
          token: ${{ secrets.EDK2_TOKEN || github.token }}
          path: edk2-under-test
          submodules: recursive
          fetch-depth: 0

      - name: Fuzz it
        id: fuzz
        uses: ./
        with:
          source: edk2-under-test
          # Blank is honoured: the action falls back to the commit actions/checkout left
          # checked out, which is the right answer when the input named a branch.
          ref: ${{ steps.what.outputs.ref }}
          budget: ${{ github.event.inputs.budget }}
          jobs: ${{ github.event.inputs.jobs }}
          targets: ${{ github.event.inputs.targets }}
          qualify-only: ${{ steps.what.outputs.qualify }}
          smm: ${{ github.event.inputs.smm }}
          open-issues: ${{ steps.what.outputs.issues }}
          # The issues land in the repository being fuzzed, not in FuzzUEr, so this needs
          # a token with Issues: write THERE. Without one the findings stay in the artifact
          # and the action says so rather than failing.
          findings-token: ${{ secrets.EDK2_TOKEN }}

      - name: Upload the findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzzuer-${{ github.run_id }}
          # The action prints where it put them, so this does not have to guess.
          path: |
            ${{ steps.fuzz.outputs.results }}/run.json
            ${{ steps.fuzz.outputs.results }}/bugs.md
            ${{ steps.fuzz.outputs.results }}/bugs.json
            ${{ steps.fuzz.outputs.results }}/presence.csv
            ${{ steps.fuzz.outputs.results }}/bench_cases.log
            ${{ steps.fuzz.outputs.results }}/*.log
            ${{ steps.fuzz.outputs.results }}/campaigns/*/crashes.csv
            ${{ steps.fuzz.outputs.results }}/campaigns/*/log.json
            ${{ steps.fuzz.outputs.results }}/campaigns/*/run.log
            ${{ steps.fuzz.outputs.results }}/campaigns/*/fuzz.txt
            ${{ steps.fuzz.outputs.results }}/reproducers/**
          if-no-files-found: warn

