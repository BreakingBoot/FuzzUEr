# Notice when a workflow run is queued that will never start, and clear it.
#
# Measured 2026-11-11/12. Six runs were pushed between 20:28 and 20:41, the self-hosted
# runner finished its last job at 21:58, and at 13:11 the next day all six were still
# `queued` with `updated_at` never once having moved -- seventeen hours.
#
# The cause is not the runner, which was the first and wrong conclusion. Those six runs
# have NO JOBS AT ALL:
#
#     GET /actions/runs/43096224516/jobs  ->  total_count: 0
#
# while every run queued normally that day reports total_count 1, including ones waiting
# behind a multi-hour job. GitHub created the run and never expanded it into jobs, so
# there was never anything for a runner to be offered. That explains the whole shape of
# it: restarting the runner changed nothing (measured -- a restart at 13:14 left all six
# queued, while a branch pushed at 13:19 was picked up in 35 seconds), and POST .../cancel
# is accepted with 202 and leaves the run queued, because there is no job to cancel.
#
# So the test is exact and needs no heuristic: queued, and zero jobs. A run waiting
# legitimately behind a seven-hour cross-version build has a job and is left alone however
# old it is, which is what an age threshold alone could never get right -- the first cut of
# this file used one, and would have cancelled the long jobs it exists to protect.
#
# It deliberately does not re-dispatch anything. An orphaned run never recovers and the
# only cure is a fresh run, but these are hours-long firmware jobs and a watchdog that
# silently started several of them would be worse than the fault. It reports; a human
# re-pushes.
#
# RUNS ON A GITHUB-HOSTED RUNNER, which is the whole point. A watchdog on the self-hosted
# runner cannot report that work is not reaching the self-hosted runner -- it would sit in
# the same queue it is supposed to be watching. This needs no firmware, no disk and no
# container: it reads the API and exits.
name: Stale queue

on:
  schedule:
    # Every half hour. `schedule` only fires from the default branch, which is where this
    # file lives; the cost is seconds of a hosted runner.
    - cron: '7,37 * * * *'
  # Push `watchdog-report-<anything>` to look without touching anything, or
  # `watchdog-<anything>` to clear what it finds.
  push:
    branches: ['watchdog-**']
  workflow_dispatch:
    inputs:
      mode:
        description: 'report | clear'
        required: false
        default: 'clear'
      grace_minutes:
        description: 'Ignore runs younger than this, so a run whose jobs have not
                      appeared yet is not mistaken for one that will never have any'
        required: false
        default: '10'

# To cancel or delete a run, and to read the runners' own state. Nothing else.
permissions:
  actions: write

jobs:
  stale-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find queued runs that will never start
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          SELF: ${{ github.run_id }}
          IN_MODE: ${{ github.event.inputs.mode }}
          IN_GRACE: ${{ github.event.inputs.grace_minutes }}
        run: |
          set -uo pipefail
          MODE="${IN_MODE:-clear}"
          GRACE="${IN_GRACE:-10}"
          # From the branch name on a push, which carries no inputs. Matched, never
          # evaluated: a branch name is attacker-controlled text in the general case.
          if [ "$EVENT" = 'push' ]; then
            case "$BRANCH" in
              watchdog-report*) MODE='report' ;;
              *)                MODE='clear'  ;;
            esac
          fi
          case "$GRACE" in ''|*[!0-9]*)
            echo "::error::grace_minutes must be a whole number, got '$GRACE'"; exit 1 ;;
          esac
          echo "mode=$MODE grace=${GRACE}m"
          python3 - "$SLUG" "$MODE" "$GRACE" "$SELF" <<'PY'
          import json, os, sys, time, urllib.error, urllib.request
          from datetime import datetime, timezone

          slug, mode, grace, me = sys.argv[1], sys.argv[2], int(sys.argv[3]), sys.argv[4]
          token = os.environ['GH_TOKEN']
          api = 'https://api.github.com'

          def call(method, path):
              req = urllib.request.Request(f'{api}{path}', method=method)
              req.add_header('Authorization', f'Bearer {token}')
              req.add_header('Accept', 'application/vnd.github+json')
              try:
                  with urllib.request.urlopen(req, timeout=30) as got:
                      body = got.read()
                      return got.status, (json.loads(body) if body else {})
              except urllib.error.HTTPError as exc:
                  return exc.code, {'message': exc.read().decode('utf-8', 'replace')[:200]}
              except OSError as exc:
                  return 0, {'message': str(exc)}

          now = datetime.now(timezone.utc)

          def minutes(stamp):
              when = datetime.strptime(stamp, '%Y-%m-%dT%H:%M:%SZ').replace(
                  tzinfo=timezone.utc)
              return (now - when).total_seconds() / 60.0

          # This workflow's own runs are excluded. It runs on a hosted runner, so counting
          # it would report the watchdog as work the self-hosted runner owes.
          mine = os.environ.get('GITHUB_WORKFLOW', 'Stale queue')

          def queued_runs():
              out, page = [], 1
              while page <= 10:
                  status, body = call('GET', f'/repos/{slug}/actions/runs'
                                             f'?status=queued&per_page=100&page={page}')
                  if status != 200:
                      sys.exit(f'::error::cannot list runs ({status}): '
                               f'{body.get("message")}')
                  batch = body.get('workflow_runs') or []
                  if not batch:
                      break
                  out.extend(batch)
                  page += 1
              return [r for r in out if str(r['id']) != me and r.get('name') != mine]

          def job_count(run_id):
              """How many jobs GitHub expanded this run into. None if it cannot be read."""
              status, body = call('GET', f'/repos/{slug}/actions/runs/{run_id}'
                                         f'/jobs?per_page=1')
              return body.get('total_count') if status == 200 else None

          def status_of(run_id):
              status, body = call('GET', f'/repos/{slug}/actions/runs/{run_id}')
              return body.get('status') if status == 200 else None

          queued = queued_runs()

          # Reported, not acted on. A run with jobs is waiting for a runner, which is
          # ordinary; the runners' own state is printed so a genuinely offline runner is
          # visible in the same place rather than inferred from the queue.
          status, body = call('GET', f'/repos/{slug}/actions/runners')
          runners = (body.get('runners') or []) if status == 200 else []
          if status != 200:
              print(f'::warning::cannot read the runners ({status}): '
                    f'{body.get("message")}')
          for runner in runners:
              print(f"  runner {runner.get('name')}: {runner.get('status')}, "
                    f"busy={runner.get('busy')}")
          if runners and not any(r.get('status') == 'online' for r in runners):
              print('::error::every registered runner is OFFLINE, so nothing queued here '
                    'can start -- the machine or its runner service is down')

          orphans, waiting, young, unknown = [], [], [], []
          for run in sorted(queued, key=lambda r: r['created_at']):
              age = minutes(run['created_at'])
              if age < grace:
                  young.append((run, age))
                  continue
              count = job_count(run['id'])
              if count is None:
                  unknown.append((run, age))
              elif count == 0:
                  orphans.append((run, age))
              else:
                  waiting.append((run, age))

          print(f'{len(queued)} queued: {len(orphans)} orphaned, {len(waiting)} waiting '
                f'for a runner, {len(young)} inside the {grace}m grace, '
                f'{len(unknown)} unreadable')

          lines = ['### Stale queue', '',
                   f'- mode `{mode}`, grace {grace} min',
                   f'- {len(orphans)} orphaned (queued with **zero jobs**), '
                   f'{len(waiting)} waiting for a runner', '']
          if orphans:
              lines += ['| run | workflow | branch | queued for | cleared |',
                        '|---|---|---|---|---|']

          cleared = stuck = 0
          for run, age in orphans:
              note = 'not attempted'
              if mode == 'clear':
                  # Cancel first. It is accepted with 202 and does nothing on a jobless
                  # run -- measured -- so the result is CHECKED rather than assumed, and
                  # the run is then deleted, which is the only thing that removes it.
                  call('POST', f"/repos/{slug}/actions/runs/{run['id']}/cancel")
                  time.sleep(2)
                  if status_of(run['id']) not in ('queued', 'pending', 'waiting', None):
                      cleared += 1
                      note = 'cancelled'
                  else:
                      code, body = call('DELETE',
                                        f"/repos/{slug}/actions/runs/{run['id']}")
                      if code in (204, 404):
                          cleared += 1
                          note = 'deleted'
                      else:
                          stuck += 1
                          note = f'STUCK ({code})'
                          print(f"::warning::run {run['id']} ({run.get('name')} on "
                                f"{run.get('head_branch')}) could not be cancelled or "
                                f"deleted: {body.get('message')}")
              print(f"  orphan {run['id']} {run.get('name')} "
                    f"({run.get('head_branch')}), {age:.0f} min -> {note}")
              lines.append(f"| [{run['id']}]({run['html_url']}) | {run.get('name')} | "
                           f"`{run.get('head_branch')}` | {age:.0f} min | {note} |")

          if orphans:
              lines.append('')
              lines.append('These were created and never expanded into jobs, so no runner '
                           'was ever offered them. An orphaned run does not recover: '
                           're-push the branch to get a fresh one.')
          if waiting:
              lines.append('')
              lines.append(f'{len(waiting)} run(s) are waiting for a runner, oldest '
                           f'{max(a for _, a in waiting):.0f} min. That is an ordinary '
                           f'queue and nothing was done to them.')

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as handle:
                  handle.write('\n'.join(lines) + '\n')
          print('\n'.join(lines))

          # Loud, because silence is what cost seventeen hours. A notice rather than a
          # failure: the queue being stuck is not this workflow malfunctioning, and a red
          # watchdog every half hour trains people to ignore it.
          if orphans and mode == 'clear':
              print(f'::warning::{len(orphans)} run(s) were queued with zero jobs and '
                    f'will never start; cleared {cleared}. Re-push to re-run them.')
          elif orphans:
              print(f'::warning::{len(orphans)} run(s) are queued with zero jobs and will '
                    f'never start (mode={mode}, nothing was cleared)')
          if unknown:
              print(f'::warning::{len(unknown)} queued run(s) could not be classified -- '
                    f'their jobs could not be read')
          if stuck:
              sys.exit(f'::error::{stuck} orphaned run(s) could not be cleared at all')
          PY
