# Run the whole pipeline against a pinned upstream stable release of edk2.
#
# Everything else here fuzzes this repository's own edk2 fork, which already carries the
# sanitizer port. That is the convenient tree and the wrong one to prove anything with: the
# port is already applied, so the `port` stage has nothing to do, and a release that broke
# it would look fine. This checks the thing a consumer actually does -- take a clean
# tianocore release and apply the port to it -- and runs every stage, fuzzing and triage
# included, rather than stopping at `qualify-only`.
#
# One release, pinned. The weekly sweep in fuzz-edk2.yml covers four of them and takes
# about sixteen hours; this is the gate you want before tagging, so it is scoped to finish
# in well under an hour.
#
# Push a branch whose name starts with "ci-stable-" to run it, or dispatch it.
name: Stable release end-to-end

on:
  push:
    branches: ['ci-stable-**']
  workflow_dispatch:
    inputs:
      ref:
        description: 'An upstream edk2 ref to fuzz instead of the pinned release'
        required: false
        default: ''

permissions:
  contents: read

env:
  # Bump this deliberately. The README's version table records which releases have been
  # verified, and a tag that is not in it has not been through this.
  STABLE_REF: edk2-stable202608

jobs:
  end-to-end:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Builds the images and, the part this workflow depends on, adds the `tianocore`
      # remote to eval_source/edk2. Warm runner: seconds. Cold: hours.
      - name: Bootstrap the runner
        run: scripts/bootstrap_runner.sh

      # The driver resolves a ref out of whichever remotes the source checkout has, so the
      # release has to be fetchable before it can be named. cglosner/edk2 carries no
      # upstream tags of its own -- `git ls-remote --tags origin 'edk2-stable*'` on it is
      # empty -- which is why this fetches from tianocore rather than assuming.
      - name: Make the upstream releases reachable
        run: git -C eval_source/edk2 fetch --tags --depth=1 tianocore

      # Out of RUNNER_TEMP. The action defaults there and the runner wipes it when the job
      # ends, so the first run of this gate failed its own assertion and left nothing to
      # read back -- the board, the log and bugs.json had all gone with the directory.
      - name: Where to keep the results
        id: where
        run: echo "out=$HOME/fuzzuer-stable-out/$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

      - id: fuzz
        uses: ./
        with:
          out: ${{ steps.where.outputs.out }}
          source: eval_source/edk2
          ref: ${{ github.event.inputs.ref || env.STABLE_REF }}
          # Four protocols that have historically produced work on every version, so a
          # green run means the pipeline carried a testcase all the way to a report rather
          # than that nothing was tried.
          targets: EfiAcpiTable EfiHiiFont EfiSmbios EdkiiFormBrowserEx
          budget: '300'
          jobs: '4'
          # A gate, not a bug hunt. Findings here are against UPSTREAM code and would be
          # filed into this repository, which is not where anyone would look for them; the
          # consumer-side path that does file is proven by examples/fuzzuer.yml.
          open-issues: false

      - name: Every stage ran and the pipeline reached triage
        shell: bash
        env:
          RESULTS: ${{ steps.fuzz.outputs.results }}
          STAGES: ${{ steps.fuzz.outputs.stages }}
          CANDIDATES: ${{ steps.fuzz.outputs.candidates }}
        run: |
          set -uo pipefail
          echo "  stages     = ${STAGES:-<empty>}   (passed/total)"
          echo "  candidates = ${CANDIDATES:-<empty>}"
          [ -n "${RESULTS:-}" ] || { echo "::error::the action set no results path"; exit 1; }
          # run.json is the authoritative record: a list of {name, ok, detail} per stage.
          # The `stages` OUTPUT is a count -- "13/13" -- and an earlier version of this
          # gate pattern-matched it for the words "fuzz" and "triage", which a count can
          # never contain, so the gate failed on a run that had actually passed.
          python3 - "$RESULTS" <<'PY'
          import json, os, re, sys
          root = sys.argv[1]
          try:
              run = json.load(open(os.path.join(root, 'run.json')))
          except OSError as exc:
              sys.exit(f'::error::cannot read run.json: {exc}')
          stages = {s['name']: s for s in run.get('stages', [])}
          for s in run.get('stages', []):
              print(f"  [{'PASS' if s['ok'] else 'FAIL'}] {s['name']:<13} {s.get('detail','')[:78]}")
          # ok is True, False, or None for a stage that did not run; only False is a
          # failure. A None matters here for a different reason, handled just below.
          bad = [n for n, s in stages.items() if s['ok'] is False]
          if bad:
              sys.exit(f"::error::stage(s) failed: {', '.join(bad)}")
          # End to end means the last two ran. They are exactly the ones qualify-only
          # skips, and they are where a release that moved under the port shows up: the
          # build can succeed and the firmware still never reach a harness.
          # Absent OR skipped. A qualify-only run records both with ok=None and the detail
          # "not run: --skip-fuzz", so checking only for absence would pass a run that
          # never fuzzed anything -- which is the one thing this gate exists to rule out.
          missing = [n for n in ('fuzz', 'triage')
                     if n not in stages or stages[n]['ok'] is not True]
          if missing:
              sys.exit(f"::error::{', '.join(missing)} did not run -- this gate is for an "
                       f"end-to-end run, and a qualify-only one skips exactly these")
          detail = stages['fuzz'].get('detail', '')
          hit = re.search(r'(\d+)/(\d+) campaign\(s\) fuzzed the harness', detail)
          if hit and hit.group(1) == '0':
              sys.exit('::error::no campaign reached the harness: the port applied and the '
                       'firmware built, but nothing was fuzzed. Every stage still passes '
                       'and the report is simply empty, which is why this is asserted.')
          if not os.path.isfile(os.path.join(root, 'bugs.json')):
              sys.exit('::error::triage wrote no bugs.json')
          print(f"  fuzz: {detail[:100]}")
          print('  end-to-end on a clean upstream release: OK')
          PY

      - name: Keep the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable-e2e-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            ${{ steps.fuzz.outputs.results }}/pipeline.log
            ${{ steps.fuzz.outputs.results }}/bugs.md
            ${{ steps.fuzz.outputs.results }}/bugs.json
            ${{ steps.fuzz.outputs.results }}/run.json
            ${{ steps.fuzz.outputs.results }}/bench_cases.log
