# Does the composite action work when GitHub runs it, rather than when a person runs its
# steps by hand?
#
# Everything else here tests the driver. This tests the wrapper: that action.yml's inputs
# arrive, that its submodule and bootstrap steps behave inside a job, that it finds the tree
# a caller points `source` at, and that its outputs come back. That path has no other cover,
# and it is the one every other repository uses.
#
# Not on every push: it builds firmware, so it costs ten minutes rather than thirty seconds.
# Push a branch whose name starts with "ci-" to run it, or dispatch it.
name: Action smoke

on:
  push:
    branches: ['ci-**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # The tree under test is this repository's own edk2 fork, which is already here as a
      # submodule. A caller would point `source` at their checkout; the action cannot tell
      # the difference, which is the point.
      - id: fuzz
        uses: ./
        with:
          source: eval_source/edk2
          qualify-only: true
          bootstrap: true

      - name: The action reported what it should
        shell: bash
        env:
          RESULTS: ${{ steps.fuzz.outputs.results }}
          STAGES: ${{ steps.fuzz.outputs.stages }}
          CANDIDATES: ${{ steps.fuzz.outputs.candidates }}
        run: |
          set -uo pipefail
          echo "  results    = ${RESULTS:-<empty>}"
          echo "  stages     = ${STAGES:-<empty>}"
          echo "  candidates = ${CANDIDATES:-<empty>}"
          rc=0
          [ -n "${RESULTS:-}" ] || { echo "::error::the action set no results path"; rc=1; }
          [ -f "${RESULTS:-}/run.json" ] \
            || { echo "::error::no run.json under ${RESULTS:-<empty>}"; rc=1; }
          # On a qualify run every stage that ran must have passed, and candidates must be
          # EMPTY rather than 0: triage never ran, and "0 candidates" would read as a clean
          # sweep of something that was never fuzzed.
          case "${STAGES:-}" in
            '') echo "::error::the action set no stage count"; rc=1 ;;
            *) p=${STAGES%%/*}; t=${STAGES##*/}
               [ "$p" = "$t" ] && echo "  all $t stage(s) passed" \
                 || { echo "::error::only $p of $t stages passed"; rc=1; } ;;
          esac
          [ -z "${CANDIDATES:-}" ] \
            || echo "::warning::candidates is '${CANDIDATES}'; a qualify run should leave it empty"
          exit $rc

      # The pipeline writes into its own checkout: a git worktree at
      # eval_source/edk2-<ref>, an imgstage/ holding a copy of the tree, and tens of GB
      # under results/. In a GitHub workspace that is the same directory the NEXT job has
      # to check out, and actions/checkout cleaning it left the workspace without a .git
      # and missing two submodules -- which failed the following Checks run for reasons
      # that had nothing to do with the commit. Hand the workspace back the way it was
      # found.
      - name: Put the workspace back
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          for sub in eval_source/edk2 firness uefi_asan tsffs; do
            [ -e "$sub/.git" ] || continue
            # a registration outliving its directory is what breaks the next fetch
            git -C "$sub" worktree prune 2>/dev/null || true
            for wt in $(git -C "$sub" worktree list --porcelain 2>/dev/null \
                        | awk '/^worktree /{print $2}'); do
              case "$wt" in
                "$GITHUB_WORKSPACE"/*) git -C "$sub" worktree remove --force "$wt" \
                                         2>/dev/null || true ;;
              esac
            done
          done
          # NOTHING is deleted from the workspace here. The pipeline keeps its worktree
          # and its build context under --work, which the action points outside the
          # workspace, so there is nothing of its making left to remove. An earlier version
          # of this step ran `rm -rf eval_source/edk2-*`, which matches the edk2-non-osi and
          # edk2-platforms SUBMODULES -- it would have deleted two real checkouts to tidy
          # up files that are no longer there.
          echo "workspace size: $(du -sh . 2>/dev/null | cut -f1)"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: action-smoke-${{ github.run_id }}
          path: |
            ${{ steps.fuzz.outputs.results }}/run.json
            ${{ steps.fuzz.outputs.results }}/bugs.md
            ${{ steps.fuzz.outputs.results }}/bugs.json
            ${{ steps.fuzz.outputs.results }}/presence.csv
            ${{ steps.fuzz.outputs.results }}/bench_cases.log
            ${{ steps.fuzz.outputs.results }}/*.log
            ${{ steps.fuzz.outputs.results }}/campaigns/*/crashes.csv
            ${{ steps.fuzz.outputs.results }}/campaigns/*/log.json
            ${{ steps.fuzz.outputs.results }}/campaigns/*/run.log
            ${{ steps.fuzz.outputs.results }}/campaigns/*/fuzz.txt
            ${{ steps.fuzz.outputs.results }}/reproducers/**
          if-no-files-found: warn

      - name: Drop the run's scratch now the results are uploaded
        if: always()
        shell: bash
        env:
          RESULTS: ${{ steps.fuzz.outputs.results }}
        run: |
          set -uo pipefail
          # Under runner.temp, not the workspace -- see --work. Tens of GB per run, so it
          # does not get to accumulate.
          scratch="${RUNNER_TEMP:-}/fuzzuer-run"
          [ -n "${RUNNER_TEMP:-}" ] && [ -d "$scratch" ] && rm -rf "$scratch" || true
          echo "dropped $scratch"
