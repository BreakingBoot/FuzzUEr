# Fuzz several edk2 versions, unattended, and say which ones the sanitizer actually reports on.
#
# Every step is scripts/fuzz_edk2.py, not a copy of its stages: a workflow that repeats the
# pipeline in YAML drifts from the pipeline, and the drift shows up as a green run that
# checked something else. The driver prints PASS/FAIL per stage and stops at the first
# failure, because every stage after one would report a number that looks like a result.
#
# Needs a self-hosted runner. This builds LLVM-instrumented OVMF and a QEMU that libafl
# compiles from source; a 4-core hosted runner does not finish inside the job timeout.
name: Fuzz EDK2

on:
  workflow_dispatch:
    inputs:
      refs:
        description: 'Space separated edk2 refs (default: the three newest stable tags and master)'
        required: false
        default: ''
      budget:
        description: 'Seconds of fuzzing per target'
        required: false
        default: '600'
      jobs:
        description: 'Targets fuzzed at once (blank: a quarter of the runner''s cores)'
        required: false
        default: ''
      boot_timeout:
        description: 'Seconds a target may spend booting to the harness (blank: scale with jobs)'
        required: false
        default: ''
      # One selector for both channels, replacing the `smi` boolean. That boolean could say
      # "handlers as well as protocols" and nothing else: not "handlers only", not one
      # handler, and -- because its default was false and an input a schedule does not
      # carry arrives as the empty string either way -- it could not tell "the caller said
      # no" from "the caller said nothing". So the answer to "does this workflow fuzz all
      # the SMI handlers" was no, four refs at a time, with discovery printing the handler
      # count on every one of them.
      #
      # all is the default because that is what fuzzing a firmware means. The cost is
      # real and belongs in the description: --smi implies SMM_REQUIRE=TRUE, so it is not
      # one extra target, it is a different firmware under every target. Measured, 18-way
      # both sides -- sweep 43704163314/fuzz-master against eval1 sweep 43454245046:
      # median boot 625s -> 2923s, harness reach 83/112 -> 66/138, and a per-ref fuzz
      # stage of 3.6h -> about 12.6h. Four refs of that is ~52h against this job's 24h
      # timeout, which is why the Sunday cron below pins `protocols` and the Wednesday one
      # pins `handlers` instead of either of them taking the default.
      channels:
        description: 'What to fuzz: all (every protocol AND every discovered SMI handler), protocols (the fast sweep -- no SMM_REQUIRE), or handlers (the SMI pass only)'
        type: choice
        required: false
        default: 'all'
        options: ['all', 'protocols', 'handlers']
      harness_timing:
        description: 'application (a boot option, after EndOfDxe) or dxe (a DXE_DRIVER in the firmware volume, before it). dxe needs a channel selection that includes the handlers; it is applied to the SMI campaigns and to nothing else'
        required: false
        default: ''
      qualify_only:
        description: 'Qualify each version -- port, build, instrument, detect -- without spending the fuzzing budget'
        type: boolean
        required: false
        default: false
  schedule:
    # Sunday: the protocol sweep, four refs, SMM off -- channels=protocols, pinned rather
    # than defaulted. The default is `all`, and `all` on four refs does not fit: the
    # measured per-ref fuzz stage goes from 3.6h to about 12.6h on an SMM_REQUIRE image
    # (boot 625s -> 2923s at the same 18-way concurrency, from sweep 43704163314 against
    # eval1 sweep 43454245046), so four refs is ~52h against the 24h timeout below. The
    # job would be killed inside the second ref, and triage is the LAST stage, so refs
    # three and four would produce no findings at all rather than fewer.
    - cron: '0 3 * * 0'
    # Wednesday: the SMI pass, master only, with the dxe harness timing. A SEPARATE cron
    # rather than channels=all on the Sunday one, because --smi implies SMM_REQUIRE=TRUE
    # and that rebuilds the firmware every protocol target is fuzzed against -- the two
    # sweeps would no longer be comparable, and together they do not fit the 24h timeout.
    # Keeping them apart also keeps the Sunday verdict meaning what it has always meant.
    #
    # Between the two crons mainline gets BOTH channels every week, which is what "all"
    # can honestly mean under a 24h ceiling. A dispatch with nothing typed still gets
    # `all`, because a caller choosing one tree is not paying the four-ref multiplier.
    #
    # This is the pass that can reach what the protocol sweep cannot: BreakingBoot/eval1_edk2
    # issue #52 is upstream MdeModulePkg code behind `if (mEndOfDxe)`, so 246665
    # application-timed iterations never touched it and one dxe-timed campaign did.
    - cron: '0 3 * * 3'
  # The sweep itself is hours, so it is not on every push. This prefix exists because
  # nothing could reach this workflow without a token: it had no push trigger, and
  # dispatching it needs the API. Both of its only two runs failed, and the verdict logic
  # below could not be exercised at all. A push to "ci-sweep-**" runs one release
  # qualify-only -- minutes -- which covers checkout, bootstrap, the loop, the ledger and
  # the verdict, everything except the fuzzing budget.
  push:
    branches: ['ci-sweep-**']

permissions:
  contents: read

jobs:
  matrix:
    runs-on: [self-hosted, linux, x64]
    # 24h, because the default sweep does not fit in less. Measured here: 243 targets at
    # --jobs 20 and a 900s budget took 6.4h for one version. The four refs below at a 600s
    # budget come to about 16h, and the old 720 would have killed the job a third of the
    # way through the second version -- with the first version's report already written,
    # so the run would look merely incomplete rather than cut short.
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Images, the fuzzer binary, the builder container and the upstream remote. Every
      # step checks for its own output first, so on a runner that has already done this
      # the whole thing is a few seconds. On a cold one it is hours: the base image builds
      # LLVM 15 from source and the fuzzer builds QEMU.
      - name: Bootstrap the runner
        run: scripts/bootstrap_runner.sh

      - name: Fetch the tags the matrix names
        run: git -C eval_source/edk2 fetch --tags --depth=1 tianocore

      - name: Fuzz each version
        id: sweep
        env:
          FIRNESS_QEMU_ICOUNT: shift=auto,sleep=off
          FIRNESS_CONTAINER_PREFIX: ci
          LEDGER: ${{ runner.temp }}/sweep.rc
          # Through the environment rather than interpolated into the script: an input is
          # whatever the person typed, and a ref like $(...) or a quote would otherwise be
          # pasted straight into the shell this step runs.
          IN_REFS: ${{ github.event.inputs.refs }}
          IN_BUDGET: ${{ github.event.inputs.budget }}
          IN_JOBS: ${{ github.event.inputs.jobs }}
          IN_BOOT_TIMEOUT: ${{ github.event.inputs.boot_timeout }}
          IN_QUALIFY: ${{ github.event.inputs.qualify_only }}
          # Declared here, in the env of the step that reads it. A name this step does not
          # declare reads as the empty string, the resolution below takes its default arm,
          # and the flag silently never applies -- which has happened twice on this
          # project and both times looked exactly like a working run.
          IN_CHANNELS: ${{ github.event.inputs.channels }}
          IN_HARNESS_TIMING: ${{ github.event.inputs.harness_timing }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -uo pipefail
          # Deliberately NOT errexit. GitHub runs a `run:` step as `bash -e {0}`, so the
          # default is on, and the whole point of the loop below is to carry on past a ref
          # that failed and record what it did. With -e the first failure would abort the
          # step, the later refs would never be tried, and the ledger would be short --
          # which sweep_verdict.py cannot distinguish from a loop that never ran. The
          # previous version worked around this with `|| rc=1` on the python call.
          set +e
          : > "$LEDGER"
          # An input's default applies to workflow_dispatch and to nothing else, so on the
          # weekly schedule every one of these arrives as an empty string -- and
          # "--budget ''" is not a small problem: argparse rejects it as "invalid int
          # value" before the first stage runs, so the scheduled sweep has never got as
          # far as fetching a ref. The defaults belong here, where both triggers reach
          # them, and they match the ones declared on the inputs.
          REFS="${IN_REFS:-}"
          QUALIFY=''
          [ "${IN_QUALIFY:-}" = 'true' ] && QUALIFY='--skip-fuzz'
          # Read out of the tree, not hardcoded. The list used to be literal and went five
          # releases stale -- it still named edk2-stable202502/202505/202511 while this
          # input's own description promised "the three newest stable tags", and it left
          # out edk2-stable202608, the only release stable-e2e.yml has ever gated on.
          # awk rather than head: head closes the pipe early, git dies of SIGPIPE and
          # pipefail turns a correct answer into a non-zero status.
          newest() {
            git -C eval_source/edk2 tag -l 'edk2-stable*' --sort=-v:refname \
              | grep -E '^edk2-stable[0-9]{6}(\.[0-9]+)?$' | awk "NR<=$1"
          }
          if [ "${GITHUB_EVENT_NAME:-}" = 'push' ]; then
            # Branch-pushed: this is the control-flow test, not a sweep. One release and
            # no fuzzing budget, because the point is to exercise the loop, the ledger and
            # the verdict in minutes. Picking refs stays with dispatch and the schedule.
            REFS="$(newest 1 | tr '\n' ' ')"
            QUALIFY='--skip-fuzz'
            echo "push-triggered: qualifying $REFS only"
          elif [ -z "$REFS" ]; then
            REFS="$(newest 3 | tr '\n' ' ')master"
          fi
          [ -n "${REFS// /}" ] || { echo "::error::no ref to fuzz: the tree has no"; \
            echo "::error::edk2-stable tag. Did the tag fetch step run?"; exit 1; }
          BUDGET="${IN_BUDGET:-600}"
          # Which channels this run fuzzes. ONE selector, resolved in one place, so the
          # answer to "did this run fuzz the SMI handlers" is a variable a reader can
          # follow rather than the interaction of a boolean, a cron expression and a
          # target list. `all` is the default, and each cron pins the channel it exists
          # for, with the cost that pins it stated beside the schedule above.
          #
          # A push stays protocol-only on purpose: it is the control-flow test, and the
          # SMM_REQUIRE build it would otherwise do is minutes it does not have.
          CHANNELS="${IN_CHANNELS:-all}"
          TIMING="${IN_HARNESS_TIMING:-}"
          if [ "${GITHUB_EVENT_NAME:-}" = 'push' ]; then
            CHANNELS='protocols'
          elif [ "${EVENT_SCHEDULE:-}" = '0 3 * * 0' ]; then
            CHANNELS='protocols'
          elif [ "${EVENT_SCHEDULE:-}" = '0 3 * * 3' ]; then
            CHANNELS='handlers'
            # master only. The SMM_REQUIRE build is slower, the relink is per campaign, and
            # the point of this pass is the handlers in current upstream code -- not a
            # matrix.
            REFS='master'
            QUALIFY=''
          fi
          case "$CHANNELS" in
            all)
              # Both channels. An EMPTY target list is what fuzz_batch.py reads as "every
              # discovered target", and under --smi that now includes the handler request
              # files -- so `all` is expressed by passing no --targets at all, which also
              # keeps fuzz_edk2.py's own campaign-count arithmetic right: it sizes the
              # fuzz stage's timeout from len(--targets) when there is one, and a channel
              # word there would count a 112-campaign queue as a single campaign and kill
              # the stage partway through.
              SMI='--smi'; TARGETS='' ;;
            protocols)
              SMI=''; TARGETS='' ;;
            handlers)
              SMI='--smi'
              # The channel word, not a hardcoded DiscoveredSmi. There are TWO handler
              # request files -- DiscoveredSmi, the comm-buffer handlers, and
              # DiscoveredSwSmi, the ones addressed by a command byte on port 0xB2 -- and
              # naming only the first meant a tree that registers a resolvable software
              # SMI never had that channel fuzzed by this workflow at all. The word
              # expands to whichever of them discovery actually wrote, so a tree with no
              # software SMI does not get a target whose request file is missing.
              #
              # Bounding it at all is what the first firing, 2026-11-11, cost: without a
              # selection the pass fuzzed every protocol discover found as well -- 254 on
              # master -- and spent about thirteen hours re-covering the surface the
              # Sunday sweep had already swept before the one target it exists for.
              TARGETS='--targets handlers'
              # dxe by default here and nowhere else: this is the pass whose whole purpose
              # is to reach a handler before the EndOfDxe latch shuts.
              [ -n "$TIMING" ] || TIMING='dxe' ;;
            *)
              echo "::error::channels must be all, protocols or handlers, got '$CHANNELS'"
              exit 1 ;;
          esac
          [ -n "$TIMING" ] || TIMING='application'
          echo "channels=$CHANNELS -> ${SMI:-no --smi} ${TARGETS:-(every discovered target)}, $TIMING timing"
          # dxe without --smi builds a UEFI_APPLICATION, places it in the firmware volume
          # and boots an empty ESP: it BUILDS, and then every target reports "the boot
          # never reached the harness". fuzz_edk2.py rejects it and so does firness.py --
          # this is just the earliest of the three places, before a 24h job starts.
          #
          # It is NOT a reason to refuse dxe alongside the protocols under `all`: the
          # timing is applied per target, and fuzz_batch.py drops it for a campaign that
          # is not an SMI one. Measured on eval1 sweep 43454245046, which ran with
          # FIRNESS_HARNESS_TIMING=dxe set: every one of its 138 protocol harnesses was
          # built MODULE_TYPE = UEFI_APPLICATION and only DiscoveredSmi got the DXE_DRIVER.
          if [ "$TIMING" = 'dxe' ] && [ -z "$SMI" ]; then
            echo "::error::harness_timing=dxe needs a channel that includes the handlers"
            echo "::error::(channels=all or channels=handlers): the dxe harness is a"
            echo "::error::DXE_DRIVER whose depex floor is gEfiSmmCommunicationProtocolGuid,"
            echo "::error::emitted only on the SMI path."
            exit 1
          fi
          # Sized to the runner rather than fixed. A campaign is one QEMU plus a harness
          # build, so a quarter of the cores keeps the box busy without making every boot
          # compete -- at 8 on this 72-core runner the sweep would have needed 31 hours,
          # and the boot timeout scales with this number for the same reason. Floor of 4
          # so a small runner still makes progress.
          JOBS="${IN_JOBS:-}"
          if [ -z "$JOBS" ]; then
            JOBS=$(( $(nproc) / 4 ))
            [ "$JOBS" -lt 4 ] && JOBS=4
          fi
          echo "fuzzing $JOBS target(s) at once on $(nproc) core(s)"
          # Passed only when someone asked for one. The boot competes with every campaign
          # booting beside it, so the script's default scales with --jobs; sending a fixed
          # 900 here would pin it back and lose targets to a timeout at high parallelism,
          # which is exactly the failure that default exists to prevent.
          BOOT=''
          [ -n "${IN_BOOT_TIMEOUT:-}" ] && BOOT="--boot-timeout ${IN_BOOT_TIMEOUT}"
          # Where the results are KEPT: outside the workspace, keyed by the run.
          #
          # The driver used to default to <workspace>/results/fuzz-<slug> and this step
          # passed no --out, so the sweep wrote its only on-disk copy into the checkout.
          # actions/checkout@v4 runs `git clean -ffdx` and -x removes ignored files, and
          # .gitignore ignores `results/*` -- so the next job to land on this self-hosted
          # runner deleted it. Measured 2026-11-11: run 42999334016, the only SMI sweep
          # that has ever completed, finished at 14:47 UTC and a Checks job that started
          # at 14:47:42 wiped results/fuzz-master. Nothing was left of it but the 90-day
          # artifact. $HOME/<name>/$GITHUB_RUN_ID is what eval1_edk2's fuzzuer.yml and
          # the weekly in cglosner/edk2 both use, and every run of those is still on disk.
          #
          # Keyed by the run id because this runner takes one sweep after another and two
          # of them writing fuzz-master is the same collision from a different direction.
          KEEP="$HOME/fuzzuer-sweep/${GITHUB_RUN_ID:?the keep directory is keyed by the run id}"
          mkdir -p "$KEEP" results
          echo "keeping the results in $KEEP"
          for ref in $REFS; do
            echo "::group::$ref"
            # The slug the consumers look up BY NAME: sweep_verdict.py reads
            # results/fuzz-<slug>/run.json for each ledger ref, so this is a contract and
            # not a label. Same expression action.yml derives its own OUT with.
            SLUG=$(printf '%s' "$ref" | tr -c 'A-Za-z0-9._-' '-')
            mkdir -p "$KEEP/fuzz-$SLUG"
            # The workspace gets a LINK to it, not a copy. Three consumers glob
            # `results/fuzz-*` -- sweep_verdict.py --results results, the Summarise step
            # and the upload-artifact paths at the end of this file -- and through the
            # link they find exactly the paths they always have, while the bytes land
            # outside the workspace as they are written. A copy-back step instead would
            # duplicate tens of gigabytes of campaign output, and would not run at all on
            # the path that matters most: the 24h timeout killing the job.
            #
            # Removed rather than created over: a real directory left here by an earlier
            # run on a dirty workspace would refuse the link, and the consumers would
            # then read a stale run.json while this sweep's landed outside.
            rm -rf "results/fuzz-$SLUG"
            ln -s "$KEEP/fuzz-$SLUG" "results/fuzz-$SLUG" || \
              echo "::error::could not link results/fuzz-$SLUG to $KEEP/fuzz-$SLUG: this" \
                   "ref's output will be on the runner but in neither the verdict nor the artifact"
            python3 scripts/fuzz_edk2.py --ref "$ref" \
              --out "$KEEP/fuzz-$SLUG" \
              --budget "$BUDGET" \
              --jobs "$JOBS" \
              --harness-timing "$TIMING" \
              $SMI \
              $TARGETS \
              $BOOT \
              $QUALIFY
            # Recorded, not acted on. The driver's exit code distinguishes degraded (2)
            # from failed (1), and which of those fails this JOB is a policy -- it lives
            # in scripts/sweep_verdict.py, where --selftest asserts it, rather than in
            # this shell where nothing could.
            printf '%s %s\n' "$ref" "$?" >> "$LEDGER"
            echo "::endgroup::"
          done
          echo '--- ledger ---'
          cat "$LEDGER"

      # The gate. Not the step above: a sweep over several refs has more than two
      # outcomes, and failing the job on any non-zero made this workflow red on every run
      # it ever completed -- no full-size sweep has come back without at least one
      # degraded stage, and `master` is in the default set precisely so upstream breakage
      # shows up here.
      - name: Did this sweep pass
        if: always()
        shell: bash
        run: python3 scripts/sweep_verdict.py --ledger '${{ runner.temp }}/sweep.rc' --results results

      # One table, so a reader sees at a glance which versions the port applied to, which
      # built instrumented, and which the sanitizer actually reported on.
      - name: Summarise
        if: always()
        run: |
          set -uo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json, os
          rows = []
          for path in sorted(glob.glob('results/fuzz-*/run.json')):
              try:
                  run = json.load(open(path))
              except Exception:
                  continue
              stages = {s['name']: s for s in run['stages']}
              rows.append((run['ref'], stages))
          if not rows:
              print('No runs produced a run.json.')
          else:
              names = ['port', 'build', 'instrumented', 'discover',
                       'image', 'detects', 'fuzz', 'triage']
              print('| version | ' + ' | '.join(names) + ' |')
              print('|---' * (len(names) + 1) + '|')
              for ref, stages in rows:
                  cells = []
                  for n in names:
                      s = stages.get(n)
                      if s is None:
                          cells.append('—')           # the run stopped before this stage
                      elif s['ok'] == 'warn':
                          # did its job, but not for every target -- the run went on and
                          # its report stands. Checked before the truthiness test below,
                          # which would otherwise call this a pass.
                          cells.append('⚠️ ' + s['detail'][:80])
                      elif s['ok']:
                          cells.append('✅ ' + s['detail'])
                      elif s['ok'] is None:
                          cells.append('⏭️ ' + s['detail'])   # deliberately not run
                      else:
                          cells.append('❌ ' + s['detail'][:60])
                  print(f'| `{ref}` | ' + ' | '.join(cells) + ' |')
          PY

      - name: Upload the findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-results
          path: |
            results/fuzz-*/run.json
            results/fuzz-*/bugs.md
            results/fuzz-*/bugs.json
            results/fuzz-*/presence.csv
            results/fuzz-*/bench_cases.log
            results/fuzz-*/*.log
            results/fuzz-*/campaigns/*/crashes.csv
            results/fuzz-*/campaigns/*/log.json
            results/fuzz-*/campaigns/*/run.log
            results/fuzz-*/campaigns/*/fuzz.txt
            results/fuzz-*/reproducers/**
          # error, not warn. The upload globs `results/fuzz-*`, which are now symlinks
          # out of the workspace, and @actions/glob is configured omitBrokenSymbolicLinks:
          # true -- so a link that did not resolve contributes NOTHING and `warn` would
          # leave a green run holding an empty artifact. That is the same silent loss this
          # file's KEEP directory exists to stop, arriving by a different route: run
          # 42999334016 looked fine and had nothing in it. Nothing legitimately produces an
          # empty set here -- a sweep that got as far as uploading has a run.json per ref.
          if-no-files-found: error
