# Fuzz several edk2 versions, unattended, and say which ones the sanitizer actually reports on.
#
# Every step is scripts/fuzz_edk2.py, not a copy of its stages: a workflow that repeats the
# pipeline in YAML drifts from the pipeline, and the drift shows up as a green run that
# checked something else. The driver prints PASS/FAIL per stage and stops at the first
# failure, because every stage after one would report a number that looks like a result.
#
# Needs a self-hosted runner. This builds LLVM-instrumented OVMF and a QEMU that libafl
# compiles from source; a 4-core hosted runner does not finish inside the job timeout.
name: Fuzz EDK2

on:
  workflow_dispatch:
    inputs:
      refs:
        description: 'Space separated edk2 refs (default: four recent stable tags)'
        required: false
        default: ''
      budget:
        description: 'Seconds of fuzzing per target'
        required: false
        default: '600'
      jobs:
        description: 'Targets fuzzed at once'
        required: false
        default: '8'
      qualify_only:
        description: 'Stop after discovery, do not spend the fuzzing budget'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read

jobs:
  matrix:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Images, the fuzzer binary, the builder container and the upstream remote. Every
      # step checks for its own output first, so on a runner that has already done this
      # the whole thing is a few seconds. On a cold one it is hours: the base image builds
      # LLVM 15 from source and the fuzzer builds QEMU.
      - name: Bootstrap the runner
        run: scripts/bootstrap_runner.sh

      - name: Fetch the tags the matrix names
        run: git -C eval_source/edk2 fetch --tags --depth=1 tianocore

      - name: Fuzz each version
        id: sweep
        env:
          FIRNESS_QEMU_ICOUNT: shift=auto,sleep=off
          FIRNESS_CONTAINER_PREFIX: ci
        run: |
          set -uo pipefail
          REFS='${{ github.event.inputs.refs }}'
          if [ -z "$REFS" ]; then
            REFS='edk2-stable202502 edk2-stable202505 edk2-stable202511 edk2-stable202608'
          fi
          QUALIFY=''
          [ '${{ github.event.inputs.qualify_only }}' = 'true' ] && QUALIFY='--skip-fuzz'
          rc=0
          for ref in $REFS; do
            echo "::group::$ref"
            python3 scripts/fuzz_edk2.py --ref "$ref" \
              --budget "${{ github.event.inputs.budget }}" \
              --jobs "${{ github.event.inputs.jobs }}" \
              $QUALIFY || rc=1
            echo "::endgroup::"
          done
          exit $rc

      # One table, so a reader sees at a glance which versions the port applied to, which
      # built instrumented, and which the sanitizer actually reported on.
      - name: Summarise
        if: always()
        run: |
          set -uo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json, os
          rows = []
          for path in sorted(glob.glob('results/fuzz-*/run.json')):
              try:
                  run = json.load(open(path))
              except Exception:
                  continue
              stages = {s['name']: s for s in run['stages']}
              rows.append((run['ref'], stages))
          if not rows:
              print('No runs produced a run.json.')
          else:
              names = ['port', 'build', 'instrumented', 'discover',
                       'image', 'detects', 'fuzz', 'triage']
              print('| version | ' + ' | '.join(names) + ' |')
              print('|---' * (len(names) + 1) + '|')
              for ref, stages in rows:
                  cells = []
                  for n in names:
                      s = stages.get(n)
                      cells.append('—' if not s else ('✅ ' + s['detail'] if s['ok']
                                                      else '❌ ' + s['detail'][:60]))
                  print(f'| `{ref}` | ' + ' | '.join(cells) + ' |')
          PY

      - name: Upload the findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-results
          path: |
            results/fuzz-*/run.json
            results/fuzz-*/bugs.md
            results/fuzz-*/bugs.json
            results/fuzz-*/build.log
            results/fuzz-*/campaigns/*/crashes.csv
