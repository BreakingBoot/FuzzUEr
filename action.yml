# Fuzz an edk2 tree with FuzzUEr from any repository's workflow.
#
# This wraps scripts/fuzz_edk2.py rather than reimplementing its stages in YAML. A workflow
# that repeats the pipeline step by step drifts from the pipeline, and the drift shows up as
# a green run that checked something else.
#
# The tree being fuzzed is yours and is named by `source`. The sanitizer integration is NOT
# taken from it -- it comes from the fork inside this action's own checkout, and the `port`
# stage applies it to a throwaway worktree of your ref. Your repository is never modified.
#
# Needs a self-hosted Linux x64 runner: this builds LLVM-instrumented OVMF and a QEMU that
# libafl compiles from source, which does not fit a hosted runner's disk or job timeout.
name: FuzzUEr
description: Fuzz an EDK2 tree's protocol and SMI handlers under AddressSanitizer

inputs:
  source:
    description: 'Path to the edk2 checkout to fuzz, relative to the workspace or absolute'
    required: true
  ref:
    description: 'Tag, branch or SHA inside that checkout. Default: whatever it has checked out'
    required: false
    default: ''
  budget:
    description: 'Seconds of fuzzing per target'
    required: false
    default: '600'
  jobs:
    description: 'Targets fuzzed at once. Blank: a quarter of the runner''s cores, floor 4'
    required: false
    default: ''
  boot-timeout:
    description: 'Seconds a target may spend booting to the harness. Blank: scale with jobs'
    required: false
    default: ''
  targets:
    description: 'Space separated protocol names. Blank: everything discovered in your tree'
    required: false
    default: ''
  qualify-only:
    description: 'Run every stage except the fuzzing. Minutes instead of hours -- use this first'
    required: false
    default: 'false'
  smm:
    description: 'Build with SMM_REQUIRE=TRUE so the image has an SMM core for SMI handlers'
    required: false
    default: 'false'
  bench:
    description: 'Also build the SanBench drivers, which measure the fuzzer rather than your firmware'
    required: false
    default: 'false'
  out:
    description: 'Where the artifacts go. Default: <action>/results/fuzz-<ref>'
    required: false
    default: ''
  fail-on-findings:
    description: 'Fail the step when triage reports candidate bugs. Default false: a finding is
                  something to read, and a sweep that goes red on one stops reporting the rest'
    required: false
    default: 'false'
  token:
    description: 'Token used to clone this action''s own repository when GitHub delivered it
                  as an archive -- which it does for any `uses: owner/FuzzUEr@ref`. Only
                  needed when FuzzUEr itself is private; a public one clones without it'
    required: false
    default: ''
  open-pr:
    description: 'When triage attributes candidates to firmware code, open a pull request
                  carrying the report and the reproducers. It goes to the repository whose
                  tree was fuzzed -- the one `source` points at -- never upstream edk2 and
                  never FuzzUEr. Needs findings-token when that is not this repository'
    required: false
    default: 'true'
  findings-token:
    description: 'Token used to push the findings branch and open the PR. Defaults to the
                  job token, which is right when `source` is this repository. Fuzzing
                  somebody else''s tree needs one with Contents: write and Pull requests:
                  write on THAT repository'
    required: false
    default: ''
  bootstrap:
    description: 'Build the images if the runner lacks them. Idempotent, and seconds on a warm
                  runner -- but hours on a cold one, so it can be turned off for a runner you
                  prepared yourself'
    required: false
    default: 'true'

outputs:
  bugs:
    description: 'The triaged report, bugs.md, or empty when triage did not run'
    value: ${{ steps.run.outputs.bugs }}
  reproducers:
    description: 'Directory holding the inputs that triggered a finding, or empty'
    value: ${{ steps.run.outputs.reproducers }}
  results:
    description: 'Directory holding run.json, bugs.md and the per-campaign logs'
    value: ${{ steps.run.outputs.results }}
  pull-request:
    description: 'URL of the PR opened for the findings, or empty'
    value: ${{ steps.pr.outputs.url }}
  candidates:
    description: 'Candidate bugs triage attributed to firmware code'
    value: ${{ steps.run.outputs.candidates }}
  stages:
    description: 'passed/total stages'
    value: ${{ steps.run.outputs.stages }}

runs:
  using: composite
  steps:
    # An action's repository is checked out WITHOUT its submodules, and three of them --
    # firness, uefi_asan, tsffs -- are the harness generator, the sanitizer and the Simics
    # backend. Without this the images build with an empty /workspace/harness_generator and
    # every campaign fails inside the container with nothing pointing back at the checkout.
    # Where the pipeline is run FROM. Normally that is the action's own directory, but a
    # `uses: owner/FuzzUEr@ref` is delivered as an ARCHIVE: no .git, and the submodule
    # directories -- the harness generator, the sanitizer, the Simics backend and the edk2
    # the port is taken from -- arrive empty. An archive also carries no gitlink SHAs, so
    # there is nothing to recover them from in place. Clone this action's own repository
    # instead, at the ref the caller asked for, and work there.
    - name: Resolve a usable checkout of this action
      id: home
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REPO: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
        IN_TOKEN: ${{ inputs.token }}
        RUNNER_TEMP_DIR: ${{ runner.temp }}
      run: |
        set -uo pipefail
        complete() {
          # Every submodule the pipeline needs, non-empty.
          for m in firness uefi_asan tsffs eval_source/edk2; do
            [ -n "$(ls -A "$1/$m" 2>/dev/null || true)" ] || return 1
          done
          return 0
        }

        HOME_DIR="$ACTION_PATH"
        if [ -e "$ACTION_PATH/.git" ]; then
          git -C "$ACTION_PATH" submodule update --init --depth=1 \
              firness uefi_asan tsffs eval_source/edk2 || true
        fi

        if ! complete "$HOME_DIR"; then
          if [ -z "${ACTION_REPO:-}" ]; then
            echo "::error::this action's submodules are empty and GitHub did not say which"
            echo "repository it came from, so they cannot be fetched. Check FuzzUEr out with"
            echo "actions/checkout and submodules: true -- not recursive, which walks"
            echo "into OpenSSL's corpora -- then use it by path."
            exit 1
          fi
          # Not runner.temp: that is wiped between jobs, and this is a ~24 GB recursive
          # clone. Keyed by repository and ref so two callers on different refs do not
          # fight over one directory.
          slug=$(printf '%s@%s' "$ACTION_REPO" "${ACTION_REF:-HEAD}" | tr -c 'A-Za-z0-9._-' '-')
          HOME_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/fuzzuer-action/$slug"
          # Reused across jobs on a self-hosted runner: the submodules are a 24 GB fetch and
          # paying it once per job would dominate every run.
          if complete "$HOME_DIR"; then
            echo "reusing $HOME_DIR"
            git -C "$HOME_DIR" fetch -q --depth=1 origin "${ACTION_REF:-HEAD}" 2>/dev/null || true
            git -C "$HOME_DIR" checkout -q FETCH_HEAD 2>/dev/null || true
            git -C "$HOME_DIR" submodule update --init --recursive -q 2>/dev/null || true
          else
            rm -rf "$HOME_DIR"; mkdir -p "$(dirname "$HOME_DIR")"
            url="https://github.com/$ACTION_REPO.git"
            [ -n "${IN_TOKEN:-}" ] && url="https://x-access-token:$IN_TOKEN@github.com/$ACTION_REPO.git"
            echo "cloning $ACTION_REPO at ${ACTION_REF:-default} (submodules included)"
            git clone -q --recurse-submodules --shallow-submodules \
                --branch "${ACTION_REF:-HEAD}" --depth 1 "$url" "$HOME_DIR" \
              || git clone -q --recurse-submodules --shallow-submodules "$url" "$HOME_DIR" \
              || { echo "::error::could not clone \$ACTION_REPO -- pass the 'token' input if it is private"; exit 1; }
          fi
          complete "$HOME_DIR" || {
            echo "::error::cloned $ACTION_REPO but its submodules are still empty"; exit 1; }
        fi
        echo "home=$HOME_DIR" >> "$GITHUB_OUTPUT"
        echo "running from $HOME_DIR"

    - name: Bootstrap the runner
      if: inputs.bootstrap == 'true'
      shell: bash
      working-directory: ${{ steps.home.outputs.home }}
      run: scripts/bootstrap_runner.sh

    - name: Fuzz
      id: run
      shell: bash
      working-directory: ${{ steps.home.outputs.home }}
      env:
        # Through the environment, never interpolated into the script body: an input is
        # whatever the caller typed, and a ref containing $(...) or a quote would otherwise
        # be pasted straight into this shell.
        IN_SOURCE: ${{ inputs.source }}
        IN_REF: ${{ inputs.ref }}
        IN_BUDGET: ${{ inputs.budget }}
        IN_JOBS: ${{ inputs.jobs }}
        IN_BOOT: ${{ inputs.boot-timeout }}
        IN_TARGETS: ${{ inputs.targets }}
        IN_QUALIFY: ${{ inputs.qualify-only }}
        IN_SMM: ${{ inputs.smm }}
        IN_BENCH: ${{ inputs.bench }}
        IN_OUT: ${{ inputs.out }}
        IN_FAIL: ${{ inputs.fail-on-findings }}
        WORKSPACE: ${{ github.workspace }}
        RUNNER_TEMP_DIR: ${{ runner.temp }}
        FIRNESS_QEMU_ICOUNT: shift=auto,sleep=off
        FIRNESS_CONTAINER_PREFIX: ci
      run: |
        set -uo pipefail

        # The caller names `source` relative to their workspace, which is the natural thing
        # to write after actions/checkout. The driver creates a git worktree of it and hands
        # the path to docker, so it has to be absolute by the time it gets there.
        case "$IN_SOURCE" in
          /*) SOURCE="$IN_SOURCE" ;;
          *)  SOURCE="$WORKSPACE/$IN_SOURCE" ;;
        esac
        if [ ! -d "$SOURCE/.git" ] && [ ! -f "$SOURCE/.git" ]; then
          echo "::error::source '$IN_SOURCE' is not a git checkout (looked in $SOURCE)."
          echo "FuzzUEr takes the ref from git history, so a tarball or an archive download"
          echo "will not do -- use actions/checkout for the tree you want fuzzed."
          exit 1
        fi

        # Default to whatever the caller already checked out. A detached HEAD from
        # actions/checkout has no branch name, so resolve to the SHA rather than guessing.
        REF="${IN_REF:-}"
        if [ -z "$REF" ]; then
          REF=$(git -C "$SOURCE" rev-parse HEAD)
          echo "no ref given, using the checked out commit $REF"
        fi

        # Sized to the runner rather than fixed. A campaign is one QEMU plus a harness build,
        # so a quarter of the cores keeps the box busy without making every boot compete for
        # it -- and the driver's boot timeout scales with this number for the same reason.
        JOBS="${IN_JOBS:-}"
        if [ -z "$JOBS" ]; then
          JOBS=$(( $(nproc) / 4 ))
          [ "$JOBS" -lt 4 ] && JOBS=4
        fi

        # Outside the workspace by default. The pipeline writes a git worktree, a docker
        # build context and its artifacts; putting any of that in the directory
        # actions/checkout owns left the next job unable to check out at all -- it ended up
        # with no .git. RUNNER_TEMP_DIR is the runner's own scratch and is not the
        # workspace.
        SCRATCH="${RUNNER_TEMP_DIR:-$PWD}/fuzzuer-run"
        mkdir -p "$SCRATCH"
        OUT="${IN_OUT:-}"
        if [ -z "$OUT" ]; then
          SLUG=$(printf '%s' "$REF" | tr -c 'A-Za-z0-9._-' '-')
          OUT="$SCRATCH/results/fuzz-$SLUG"
        fi

        set -- --ref "$REF" --source "$SOURCE" --budget "${IN_BUDGET:-600}" \
               --jobs "$JOBS" --out "$OUT" --work "$SCRATCH"
        [ -n "${IN_BOOT:-}" ]   && set -- "$@" --boot-timeout "$IN_BOOT"
        [ "${IN_QUALIFY:-}" = 'true' ] && set -- "$@" --skip-fuzz
        [ "${IN_SMM:-}" = 'true' ]     && set -- "$@" --smm
        [ "${IN_BENCH:-}" = 'true' ]   && set -- "$@" --bench
        # Unquoted on purpose: these are several target names, not one.
        # shellcheck disable=SC2086
        [ -n "${IN_TARGETS:-}" ] && set -- "$@" --targets $IN_TARGETS

        echo "fuzzing $JOBS target(s) at once on $(nproc) core(s)"
        python3 -u scripts/fuzz_edk2.py "$@"
        rc=$?

        # Each stage writes its own log into the results directory. Until now a failure
        # said only that the pipeline exited non-zero and left the reason in a file the
        # caller had to download the artifact to read -- no help at all when the run died
        # before the upload step. Print the stage table and the log tails here so the job
        # log explains itself.
        if [ "$rc" -ne 0 ]; then
          echo "=== the pipeline exited $rc ==="
          python3 -c "import json,sys; r=json.load(open(sys.argv[1]+'/run.json')); print(chr(10).join('  %-6s %-14s %s' % (('skip' if s.get('ok') is None else ('ok' if s.get('ok') is True else ('warn' if s.get('ok')=='warn' else 'FAIL'))), s.get('name','?'), s.get('detail','')) for s in r.get('stages',[])))" "$OUT" 2>/dev/null || echo '  (the run wrote no run.json -- it failed before the first stage)'
          for l in "$OUT"/*.log; do
            [ -f "$l" ] || continue
            echo "--- $(basename "$l") ($(wc -l < "$l") lines, last 40) ---"
            tail -40 "$l"
          done
        fi

        echo "results=$OUT" >> "$GITHUB_OUTPUT"
        echo "source-path=$SOURCE" >> "$GITHUB_OUTPUT"
        [ -f "$OUT/bugs.md" ] && echo "bugs=$OUT/bugs.md" >> "$GITHUB_OUTPUT" \
                             || echo "bugs=" >> "$GITHUB_OUTPUT"
        # The inputs that actually triggered a finding. A campaign keeps them under
        # qemu/crashes, and until now nothing published them: the report said "a finding at
        # this site" and the bytes that reproduce it stayed on the runner. One sweep had 801
        # of them for a single protocol, so they are collected rather than globbed into the
        # upload step.
        REPRO="$OUT/reproducers"
        found=0
        for c in "$OUT"/campaigns/*/qemu/crashes; do
          [ -d "$c" ] || continue
          n=$(ls -A "$c" 2>/dev/null | wc -l)
          [ "$n" -eq 0 ] && continue
          name=$(basename "$(dirname "$(dirname "$c")")")
          mkdir -p "$REPRO/$name"
          cp -a "$c"/. "$REPRO/$name"/ 2>/dev/null || true
          found=$((found + n))
        done
        if [ "$found" -gt 0 ]; then
          echo "reproducers=$REPRO" >> "$GITHUB_OUTPUT"
          echo "collected $found reproducer input(s) under $REPRO"
        else
          echo "reproducers=" >> "$GITHUB_OUTPUT"
        fi

        # Read the counts back out of run.json rather than scraping stdout, so the step's
        # outputs say the same thing the uploaded artifact does.
        python3 - "$OUT" "$GITHUB_OUTPUT" <<'PY'
        import json, os, sys
        out, github_output = sys.argv[1], sys.argv[2]
        passed = total = 0
        candidates = ''
        try:
            run = json.load(open(os.path.join(out, 'run.json')))
            for stage in run.get('stages', []):
                if stage.get('ok') is None:      # deliberately skipped, not a result
                    continue
                total += 1
                if stage.get('ok'):              # True or 'warn'
                    passed += 1
        except Exception:
            pass
        # From bugs.json, not run.json: run.json carries only the ref and the stage list,
        # and triage's own detail line is prose. bugs.json['candidates'] is the list the
        # report is built from, so counting it cannot disagree with bugs.md.
        try:
            bugs = json.load(open(os.path.join(out, 'bugs.json')))
            found = bugs.get('candidates')
            if isinstance(found, list):
                candidates = str(len(found))
            elif found is not None:
                candidates = str(found)
        except Exception:
            pass
        with open(github_output, 'a') as handle:
            handle.write(f'stages={passed}/{total}\n')
            handle.write(f'candidates={candidates}\n')
        with open(os.path.join(out, '.candidates'), 'w') as handle:
            handle.write(candidates or '0')
        PY

        # The heredoc above left the count in a file so this does not have to parse
        # run.json a second time, nor read back from $GITHUB_OUTPUT, which is write-only
        # within the step that appends to it.
        if [ "${IN_FAIL:-}" = 'true' ] && [ "$rc" -eq 0 ]; then
          n=$(cat "$OUT/.candidates" 2>/dev/null || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "::error::triage reported $n candidate bug(s); see the artifact's bugs.md"
            rc=1
          fi
        fi
        exit $rc


    # The PR goes to the repository whose TREE WAS FUZZED -- the checkout `source` points
    # at -- and nowhere else. Not upstream edk2: a candidate is not a confirmed defect and
    # upstream did not ask for it. Not FuzzUEr either: the findings are about the caller's
    # firmware, not about the tool, and an earlier version of this opened them against the
    # tool because it ran git in the wrong directory.
    - name: Open a PR for the findings
      id: pr
      if: always() && inputs.open-pr == 'true' && steps.run.outputs.candidates != '' && steps.run.outputs.candidates != '0'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.findings-token != '' && inputs.findings-token || github.token }}
        SRC: ${{ steps.run.outputs.source-path }}
        RESULTS: ${{ steps.run.outputs.results }}
        BUGS: ${{ steps.run.outputs.bugs }}
        REPRO: ${{ steps.run.outputs.reproducers }}
        N: ${{ steps.run.outputs.candidates }}
        REF_FUZZED: ${{ inputs.ref }}
      run: |
        set -uo pipefail
        # Written once, at whichever exit is taken. Appending a placeholder up front and
        # then the real value leaves two url= lines and leans on last-one-wins, which is
        # not a thing to make a published output depend on.
        emit() { echo "url=${1:-}" >> "$GITHUB_OUTPUT"; }
        [ -d "${SRC:-}/.git" ] || [ -f "${SRC:-}/.git" ] || {
          echo "::warning::$SRC is not a git checkout, so there is nowhere to open a PR"
          emit; exit 0; }

        remote=$(git -C "$SRC" remote get-url origin 2>/dev/null) || remote=''
        [ -n "$remote" ] || {
          echo "::warning::the fuzzed tree has no origin; findings stay in the artifact"
          emit; exit 0; }
        # Refuse to push findings at upstream. The tool is pointed at forks and platform
        # branches; a candidate list is not something to send tianocore unasked.
        case "$remote" in
          *tianocore/edk2*|*git.tianocore*)
            echo "::warning::$remote is upstream edk2 -- not opening a PR there. The"
            echo "findings are in the run artifact; disclose deliberately if they hold up."
            emit; exit 0 ;;
        esac

        branch="fuzzuer-findings/${GITHUB_RUN_ID}"
        dest="fuzzuer-findings/${GITHUB_RUN_ID}"
        cd "$SRC"
        base=$(git rev-parse --abbrev-ref HEAD 2>/dev/null)
        [ "$base" = "HEAD" ] && base="${REF_FUZZED:-}"
        mkdir -p "$dest"
        [ -n "${BUGS:-}" ] && [ -f "$BUGS" ] && cp "$BUGS" "$dest/bugs.md"
        for f in bugs.json run.json presence.csv; do
          [ -f "${RESULTS:-}/$f" ] && cp "$RESULTS/$f" "$dest/"
        done
        # Reproducers only when small. A sweep can leave thousands; the PR is for reading
        # and the run artifact carries every one of them regardless.
        if [ -n "${REPRO:-}" ] && [ -d "$REPRO" ]; then
          kb=$(du -sk "$REPRO" | cut -f1)
          if [ "$kb" -le 2048 ]; then cp -a "$REPRO" "$dest/reproducers"
          else echo "${kb}KB of reproducer inputs -- see the run artifact" > "$dest/reproducers.txt"
          fi
        fi

        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git checkout -q -b "$branch" 2>/dev/null || git checkout -q "$branch"
        git add "$dest"
        git commit -q -m "Fuzzing findings from run ${GITHUB_RUN_ID}" || {
          echo "::warning::nothing to commit, so no PR"; emit; exit 0; }
        git push -q origin "$branch" || {
          echo "::warning::could not push $branch to $remote -- findings-token needs"
          echo "Contents: write on that repository. The artifact still has everything."
          emit; exit 0; }

        {
          echo "Triage attributed **$N** candidate(s) to firmware code in this tree."
          echo
          echo "- report: \`$dest/bugs.md\`"
          echo "- every reproducer input: the run $GITHUB_RUN_ID artifact"
          echo
          echo "A candidate is something to read, not a confirmed defect. Before acting:"
          echo
          echo "1. check the **module** column -- a report against the harness says nothing"
          echo "   about your firmware;"
          echo "2. check whether it is **input driven** -- \`bugs.md\` separates reports a"
          echo "   testcase provoked from ones that fire on every boot; both can be real;"
          echo "3. one site with thousands of hits is a loop or a scanner, not that many bugs."
          echo
          echo "Opened because the count was non-zero. A clean run opens nothing."
        } > "$RUNNER_TEMP/pr-body.md"

        # curl against the REST API, not `gh`. The CLI is absent on the self-hosted runner
        # this was built against, and a runner that cannot open the PR would otherwise push
        # the branch and report success with nothing to show. curl and python3 are already
        # needed by everything above this line.
        slug=$(printf '%s' "$remote" | sed -e 's#^git@[^:]*:##' \
                 -e 's#^https\{0,1\}://[^/]*/##' -e 's#\.git$##')
        payload=$(python3 - "$N" "$branch" "${base:-main}" "$RUNNER_TEMP/pr-body.md" <<'PYJSON'
        import json, sys
        n, head, base, body_file = sys.argv[1:5]
        print(json.dumps({"title": "Fuzzing findings: %s candidate(s)" % n,
                          "body": open(body_file).read(),
                          "head": head, "base": base}))
        PYJSON
        )
        resp=$(printf '%s' "$payload" | curl -sS -X POST \
                 -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 -H "X-GitHub-Api-Version: 2022-11-28" \
                 --data-binary @- "https://api.github.com/repos/$slug/pulls" 2>&1)
        # -c, not a heredoc: a heredoc feeds the PROGRAM on stdin, which is the same
        # channel the response is piped in on. They collide, sys.stdin comes up empty, and
        # every reply -- success included -- reads as unparseable, so the step reports "no
        # PR opened" for a PR it just created.
        url=$(printf '%s' "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("html_url") or "")' 2>/dev/null || true)
        if [ -n "${url:-}" ]; then
          emit "$url"; echo "opened $url"
        else
          emit
          why=$(printf '%s' "$resp" | python3 -c 'import json,sys; d=json.load(sys.stdin); e="; ".join(x.get("message","") for x in d.get("errors",[]) if x.get("message")); print((d.get("message","") + (" -- " + e if e else "")) or "no html_url returned")' 2>/dev/null || echo "unparseable response")
          echo "::warning::branch $branch is pushed to $slug but no PR was opened: $why"
        fi

    - name: Summarise
      if: always()
      shell: bash
      working-directory: ${{ steps.home.outputs.home }}
      env:
        OUT: ${{ steps.run.outputs.results }}
      run: |
        set -uo pipefail
        python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
        import json, os
        out = os.environ.get('OUT', '')
        path = os.path.join(out, 'run.json')
        if not os.path.isfile(path):
            print('### FuzzUEr\n\nThe run produced no `run.json`, so it stopped before the '
                  'first stage reported. The step log is the only record.')
            raise SystemExit
        run = json.load(open(path))
        print(f"### FuzzUEr — `{run.get('ref', '?')}`\n")
        print('| stage | result | detail |')
        print('|---|---|---|')
        mark = {True: 'pass', 'warn': 'warn', False: 'FAIL', None: 'skipped'}
        for stage in run.get('stages', []):
            ok = stage.get('ok')
            print(f"| {stage.get('name','')} | {mark.get(ok, ok)} "
                  f"| {str(stage.get('detail',''))[:140]} |")
        n = None
        try:
            found = json.load(open(os.path.join(out, 'bugs.json'))).get('candidates')
            n = len(found) if isinstance(found, list) else found
        except Exception:
            pass
        if n is not None:
            print(f"\n{n} candidate bug(s) attributed to firmware code. "
                  f"`bugs.md` in the artifact has the table; a candidate is something to "
                  f"read, not yet a confirmed defect.")
        PY
